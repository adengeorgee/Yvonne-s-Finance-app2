<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2f7"><link rel="manifest" href="manifest.json"><title>Finance Manager</title>
<style>
:root{--bg:#edf1f7;--tx:#152033;--mu:#697588;--cd:rgba(255,255,255,.75);--ln:rgba(120,135,155,.22);--bl:#1677ff;--gr:#23a36a;--rd:#df5362;--or:#ed8b32;--tk:rgba(90,110,140,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#0f141e;--tx:#e8edf6;--mu:#8e9bb0;--cd:rgba(30,38,54,.85);--ln:rgba(150,165,190,.22);--tk:rgba(150,165,190,.18)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif}
[hidden]{display:none!important}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
input,select{border:1px solid var(--ln);background:var(--cd);padding:11px;border-radius:12px;outline:0;width:100%;min-width:0}input:focus,select:focus{border-color:var(--bl)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;max-width:1100px;margin:auto}
.ti{font-size:21px;margin:2px 0;letter-spacing:-.5px}.eb,.sub,small,.rf{color:var(--mu);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:1100px;margin:auto;position:sticky;top:0;z-index:5;background:var(--bg)}
nav button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--mu);white-space:nowrap}nav button.on{background:var(--cd);color:var(--tx);box-shadow:0 4px 14px rgba(40,55,80,.1)}
main{max-width:1100px;margin:auto;padding:8px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px}.card h2{font-size:16px;margin:0 0 12px}.mt{margin-top:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
.val{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:4px 0}.pos{color:var(--gr)}.neg{color:var(--rd)}
.btn{border:1px solid var(--ln);background:var(--cd);padding:10px 14px;border-radius:12px;font-weight:700}.btn.primary{background:var(--bl);color:#fff;border-color:transparent}.btn:disabled{opacity:.45}.btn.danger{color:var(--rd)}
.fm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:760px){.fm{grid-template-columns:1fr}}
.fd label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:4px}.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}.chk input{width:auto}
.row{padding:10px 0;border-top:1px solid var(--ln)}.row:first-child{border:0}.rt{display:flex;justify-content:space-between;gap:8px}.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.trk{height:11px;background:var(--tk);border-radius:99px;position:relative;margin:7px 0 4px}.trk i{display:block;height:100%;border-radius:99px;transition:width .2s}.trk u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--tx);border-radius:2px;opacity:.75}
.brow{display:grid;grid-template-columns:1fr 92px 70px 86px 38px;gap:6px;align-items:center;margin-top:8px}.brow .btn{padding:8px}.ba{font-size:12px;text-align:right;font-weight:700}
@media(max-width:760px){.brow{grid-template-columns:1fr 84px 62px 38px}.ba{display:none}}
.tot{font-size:18px;font-weight:800;margin-top:14px}
.tx{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--ln);align-items:center}.tx:first-child{border:0}.tx .b{display:flex;gap:6px;align-items:center}.tx .btn{padding:5px 9px;font-size:12px}
.mn{display:flex;align-items:center;gap:10px;margin:6px 0 12px}.mn b{min-width:130px;text-align:center}.mn .btn{padding:6px 12px}
.flow{display:flex;gap:8px;height:130px;align-items:flex-end}.flow>div{flex:1;text-align:center}.fb{height:110px;display:flex;gap:3px;align-items:flex-end}.fb i{flex:1;border-radius:5px 5px 0 0;min-height:2px}.lg{display:flex;gap:14px;font-size:11px;color:var(--mu);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10px;text-transform:uppercase;color:var(--mu);text-align:left;padding:6px}td{padding:9px 6px;border-top:1px solid var(--ln)}.ov{overflow-x:auto}
.empty{text-align:center;color:var(--mu);padding:22px}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.lock.hide{display:none}
.lb{width:min(400px,100%);background:var(--cd);border:1px solid var(--ln);border-radius:26px;padding:26px;display:grid;gap:10px}.lb h1{margin:0;font-size:25px}.lb p{margin:0;color:var(--mu);font-size:13px}.lb input{text-align:center;font-size:20px;letter-spacing:5px}.lb #rc{letter-spacing:3px;font-size:16px}
.lm{color:var(--rd);font-size:13px;min-height:18px;text-align:center}.lnk{border:0;background:none;color:var(--bl);font-size:13px;font-weight:600}.code{font:700 26px ui-monospace,Menlo,monospace;text-align:center;letter-spacing:3px;padding:16px;background:var(--tk);border-radius:14px;user-select:all}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;background:var(--bl);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:800;box-shadow:0 10px 30px rgba(22,119,255,.4)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#18253a;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id="lock" class="lock"><form id="lf" class="lb" autocomplete="off"></form></div>
<div id="app" hidden><header><div><div class="eb" id="mlab"></div><h1 class="ti">Yvonne's Finance Manager</h1></div><button class="btn" data-a="lock">🔒 Lock</button></header><nav id="nav"></nav><main id="view"></main><button class="fab" id="fab" data-a="quick">＋ Transaction</button></div>
<input type="file" id="imf" accept=".json" hidden><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),K="fm_v4",A="fm_auth";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=n=>"₹"+Math.round(Number(n)||0).toLocaleString("en-IN"),clone=o=>JSON.parse(JSON.stringify(o)),uid=()=>Math.random().toString(36).slice(2,9);
const COL=["#1677ff","#23a36a","#ed8b32","#df5362","#8168e5","#c66aef","#708090","#14b8a6","#eab308"],INC=["Salary","Freelance","Dividend","Interest","Other income"];
const DEF=()=>({v:4,income:60000,opening:0,liab:0,tx:[],goals:[],assets:[],snap:{},plan:{g:5,r:8},rec:[],recDone:[],
 cats:[["Investments",20,"invest"],["Savings",20,"save"],["Necessities",30,"spend"],["Splurge",10,"spend"],["Education",5,"spend"],["Gifts",5,"spend"],["Others",10,"spend"]].map((c,i)=>({id:"c"+i,name:c[0],pct:c[1],kind:c[2],color:COL[i]}))});
let S,tab="home",cur="",editId=null,dr=null,authed=false,mode="",pend={},hiddenAt=0;
const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),iso=d=>mk(d)+"-"+String(d.getDate()).padStart(2,"0");cur=mk(new Date());
const mlabel=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});
function toast(s){let t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove("show"),2000)}
/* ---------- data ---------- */
function migrate(o){let d=DEF(),ks={Investments:"invest",Investment:"invest",Savings:"save",Saving:"save"};d.income=+o.incomeTarget||d.income;d.opening=+o.openingBalance||0;d.liab=+o.liabilities||0;
 if(Array.isArray(o.allocation)&&o.allocation.length)d.cats=o.allocation.map((a,i)=>({id:"c"+i,name:a[0],pct:+a[1]||0,kind:ks[a[0]]||"spend",color:a[2]||COL[i%COL.length]}));
 d.tx=o.transactions.map((t,i)=>({id:"t"+i,date:t.date,desc:t.desc,amount:+t.amount||0,type:t.type,cat:t.cat,account:t.account||"",noAsset:1}));
 d.snap={};(o.netWorth||[]).forEach(n=>{let dt=new Date("1 "+n.month);if(!isNaN(dt))d.snap[mk(dt)]=Math.round(+n.value||0)});
 d.goals=(o.goals||[]).map((g,i)=>({id:"g"+i,name:g.name,target:+g.target||0,current:+g.current||0}));
 d.assets=(o.assets||[]).map((a,i)=>({id:"a"+i,name:a.name,type:a.type,cost:+a.cost||0,value:+a.value||0,income:+a.income||0}));
 if(o.plan)d.plan={g:+o.plan.growth||5,r:+o.plan.returnRate||8};return d}
function load(){try{let d=JSON.parse(localStorage.getItem(K)||"null");if(d&&Array.isArray(d.tx))return Object.assign(DEF(),d);let o=JSON.parse(localStorage.getItem("financeOS_v3")||localStorage.getItem("financeOS_v2")||"null");if(o&&Array.isArray(o.transactions))return migrate(o)}catch(e){}return DEF()}
function store(){localStorage.setItem(K,JSON.stringify(S))}
function save(){S.snap[mk(new Date())]=Math.round(netWorth());store();render()}
const kindOf=n=>(S.cats.find(c=>c.name===n)||{kind:"spend"}).kind;
function tot(k){let t={inc:0,spend:0,save:0,inv:0,by:{}};S.tx.forEach(x=>{if(!String(x.date).startsWith(k))return;let a=+x.amount||0;if(x.type==="income"){t.inc+=a;return}let kd=kindOf(x.cat);if(kd==="save")return;t[kd==="spend"?"spend":"inv"]+=a;t.by[x.cat]=(t.by[x.cat]||0)+a});t.save=t.inc-t.spend-t.inv;t.left=t.save;return t}
function cash(){let c=+S.opening||0;S.tx.forEach(x=>{let a=+x.amount||0;if(x.type==="income")c+=a;else if(kindOf(x.cat)!=="save")c-=a});return c}
function unlinked(){return S.tx.filter(x=>x.type==="expense"&&kindOf(x.cat)==="invest"&&!x.noAsset&&!S.assets.some(a=>a.id===x.assetId)).reduce((a,x)=>a+(+x.amount||0),0)}
const assetsVal=()=>S.assets.reduce((a,x)=>a+(+x.value||0),0)+unlinked(),netWorth=()=>cash()+assetsVal()-(+S.liab||0);
function asset(t,s){if(!t.assetId||t.type!=="expense")return;let a=S.assets.find(x=>x.id===t.assetId);if(a){a.cost=Math.max(0,a.cost+s*t.amount);a.value=Math.max(0,a.value+s*t.amount)}}
function runRec(){let n=new Date(),k=mk(n),ch=0;S.rec.forEach(r=>{let key=r.id+"|"+k;if(S.recDone.includes(key)||n.getDate()<r.day)return;S.recDone.push(key);let t={id:uid(),date:k+"-"+String(r.day).padStart(2,"0"),desc:r.desc,amount:r.amount,type:r.type,cat:r.cat,assetId:r.assetId||"",auto:1};S.tx.push(t);asset(t,1);ch=1});if(ch)store()}
/* ---------- PIN / lock ---------- */
const enc=new TextEncoder(),getA=()=>{try{return JSON.parse(localStorage.getItem(A)||"null")}catch(e){return null}};
function setA(a){localStorage.setItem(A,JSON.stringify(a));if(!getA())throw new Error("Your browser blocked storage. Use normal Safari/Chrome, not Private mode.")}
async function hash(s,salt){try{let k=await crypto.subtle.importKey("raw",enc.encode(s),"PBKDF2",false,["deriveBits"]),b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p:"+salt+s}}
function rcode(){let a=new Uint8Array(10);(crypto.getRandomValues?crypto:window.crypto).getRandomValues(a);return[...a].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("")}
const chk=async p=>{let a=getA();return !!a&&await hash(p||"",a.salt)===a.hash};
const pinIn=(id,ph)=>`<input id="${id}" type="password" inputmode="numeric" maxlength="6" placeholder="${ph}" autocomplete="off">`;
function lockUI(m,msg=""){mode=m;$("lock").classList.remove("hide");$("app").hidden=true;
 let h={setup:`<div class="eb">PRIVATE & LOCAL</div><h1>Create your PIN</h1><p>Choose 4–6 digits. A recovery code comes next.</p>${pinIn("p1","New PIN")}${pinIn("p2","Confirm PIN")}`,
 unlock:`<div class="eb">PRIVATE & LOCAL</div><h1>Welcome back</h1><p>Enter your PIN to open your finances.</p>${pinIn("p1","PIN")}`,
 recover:`<h1>Reset PIN</h1><p>Enter your recovery code and choose a new PIN. Your records are kept.</p><input id="rc" placeholder="RECOVERY CODE" autocapitalize="characters">${pinIn("p1","New PIN")}${pinIn("p2","Confirm new PIN")}`,
 code:`<h1>Save your recovery code</h1><p>It is the only way to reset a forgotten PIN. Write it down now; it will not be shown again.</p><div class="code">${pend.code}</div><label class="chk"><input type="checkbox" id="ok"> I have saved this code</label>`}[m];
 $("lf").innerHTML=h+`<div class="lm" id="lm">${esc(msg)}</div><button class="btn primary">${{setup:"Create PIN",unlock:"Unlock",recover:"Reset PIN",code:"Continue"}[m]}</button>`+(m==="unlock"?`<button type="button" class="lnk" data-a="forgot">Forgot PIN?</button>`:m==="recover"?`<button type="button" class="lnk" data-a="back">Back</button><button type="button" class="lnk" style="color:var(--rd)" data-a="erase">Erase all data instead</button>`:"");
 setTimeout(()=>($("p1")||$("rc")||{focus(){}}).focus(),80)}
function enter(){authed=true;$("lock").classList.add("hide");$("app").hidden=false;runRec();render()}
function lockNow(){authed=false;dr=null;editId=null;$("view").innerHTML="";lockUI("unlock")}
$("lf").addEventListener("submit",async e=>{e.preventDefault();let v=id=>$(id)?$(id).value.trim():"",btn=$("lf").querySelector(".primary");btn.disabled=true;
 try{if(mode==="code"){if(!$("ok").checked)throw new Error("Tick the box once you have saved the code.");enter();return}
  let a=getA(),p1=v("p1"),p2=v("p2");
  if(mode==="setup"||mode==="recover"){if(!/^\d{4,6}$/.test(p1))throw new Error("PIN must be 4–6 digits.");if(p1!==p2)throw new Error("The two PINs don't match.");
   if(mode==="recover"){if(!a||!a.rec)throw new Error("No recovery code exists for this device. Use 'Erase all data instead'.");if(await hash(v("rc").toUpperCase().replace(/[\s-]/g,""),a.salt+"r")!==a.rec)throw new Error("That recovery code is not correct.");a.hash=await hash(p1,a.salt);a.fails=0;a.until=0;setA(a);enter();toast("PIN reset — your data is safe");return}
   let salt=rcode(),code=rcode();setA({salt,hash:await hash(p1,salt),rec:await hash(code,salt+"r"),fails:0,until:0});pend.code=code;lockUI("code");return}
  if(Date.now()<(a.until||0))throw new Error("Too many attempts. Wait "+Math.ceil((a.until-Date.now())/1000)+"s.");
  if(await hash(p1,a.salt)===a.hash){a.fails=0;a.until=0;setA(a);enter()}else{a.fails=(a.fails||0)+1;if(a.fails>=5)a.until=Date.now()+30000*2**Math.min(a.fails-5,5);setA(a);throw new Error("Incorrect PIN.")}
 }catch(err){if($("lm"))$("lm").textContent=err.message;if($("p1"))$("p1").value="";if($("p2"))$("p2").value=""}finally{btn.disabled=false}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(authed&&Date.now()-hiddenAt>120000)lockNow()});
/* ---------- views ---------- */
const TABS=[["home","Home"],["money","Money"],["budget","Budget"],["goals","Goals"],["invest","Invest"],["plan","5-Year Plan"],["tax","Tax"],["set","Settings"]];
const mnav=()=>`<div class="mn"><button class="btn" data-a="pm">‹</button><b>${mlabel(cur)}</b><button class="btn" data-a="nm">›</button></div>`;
function bars(k){let t=tot(k),base=+S.income||0,fs=(S.cats.find(c=>c.kind==="save")||{}).id,rows=S.cats.map(c=>{let tg=base*c.pct/100,a=c.kind==="save"?(c.id===fs?t.save:0):(t.by[c.name]||0),set=c.kind!=="spend",over=!set&&a>tg+.5,mx=Math.max(tg,a,1),pct=tg?Math.max(0,Math.round(a/tg*100)):a>0?100:0,st=set?(a>=tg&&tg>0?"Target reached":R(Math.max(0,tg-a))+" to go"):over?"Over by "+R(a-tg):R(tg-a)+" left";
 return`<div class="row"><div class="rt"><span><i class="sw" style="background:${c.color}"></i>${esc(c.name)} <small>${set?(c.kind==="save"?"· automatic":"· investing"):""}</small></span><b class="${over?"neg":""}">${R(a)} <small>/ ${R(tg)}</small></b></div><div class="trk"><i style="width:${Math.max(0,Math.min(100,a/mx*100))}%;background:${over?"var(--rd)":set&&tg>0&&a>=tg?"var(--gr)":c.color}"></i><u style="left:${Math.min(99,tg/mx*100)}%"></u></div><div class="rf ${over?"neg":""}">${pct}% · ${st}</div></div>`}).join("");
 let orph=t.spend-S.cats.filter(c=>c.kind==="spend").reduce((a,c)=>a+(t.by[c.name]||0),0);if(orph>.5)rows+=`<div class="row"><div class="rt"><span>Uncategorised</span><b class="neg">${R(orph)}</b></div><div class="rf">Spending in a category you've since removed</div></div>`;return rows}
function flow(){let[y,m]=cur.split("-").map(Number),ks=[0,1,2,3,4,5].map(i=>mk(new Date(y,m-1-(5-i),1))),ts=ks.map(tot),mx=Math.max(1,...ts.map(t=>Math.max(t.inc,t.spend+t.inv)));
 return`<div class="flow">${ks.map((k,i)=>{let t=ts[i];return`<div><div class="fb"><i style="height:${t.inc/mx*100}%;background:var(--gr)"></i><i style="height:${(t.spend+t.inv)/mx*100}%;background:var(--rd)"></i></div><small>${new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString("en-IN",{month:"short"})}</small></div>`}).join("")}</div><div class="lg"><span><i class="sw" style="background:var(--gr)"></i>Income</span><span><i class="sw" style="background:var(--rd)"></i>Outflow</span></div>`}
function spark(){let ks=Object.keys(S.snap).sort(),v=ks.map(k=>S.snap[k]);if(v.length<2)return'<div class="empty">History builds automatically each month you use the app.</div>';let mn=Math.min(...v),mx=Math.max(...v),r=Math.max(1,mx-mn);return`<svg viewBox="0 0 300 90" style="width:100%"><polyline fill="none" stroke="#1677ff" stroke-width="3" stroke-linejoin="round" points="${v.map((x,i)=>`${8+i*284/(v.length-1)},${80-(x-mn)/r*66}`).join(" ")}"/></svg><div class="lg"><span>${ks[0]}</span><span style="margin-left:auto">${ks.at(-1)}</span></div>`}
const txRow=t=>`<div class="tx"><span>${esc(t.desc)}${t.auto?" ↻":""}<small style="display:block">${esc(t.cat)}${t.type==="expense"&&kindOf(t.cat)==="save"?" (old transfer, ignored)":""} · ${t.date}</small></span><span class="b"><b class="${t.type==="income"?"pos":"neg"}">${t.type==="income"?"+":"−"}${R(t.amount)}</b><button class="btn" data-a="edit" data-i="${t.id}">Edit</button><button class="btn" data-a="del" data-i="${t.id}">✕</button></span></div>`;
function home(){let t=tot(cur),sv=S.cats.find(c=>c.kind==="save"),nw=netWorth(),rec=S.tx.filter(x=>x.date.startsWith(cur)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 return`${mnav()}<div class="g4"><div class="card"><small>Income</small><div class="val pos">${R(t.inc)}</div><small>Target ${R(S.income)}</small></div><div class="card"><small>Spent</small><div class="val">${R(t.spend)}</div><small>${t.inc?Math.round(t.spend/t.inc*100):0}% of income</small></div><div class="card"><small>Invested</small><div class="val">${R(t.inv)}</div><small>Moved to investments</small></div><div class="card"><small>Savings (automatic)</small><div class="val ${t.save<0?"neg":"pos"}">${R(t.save)}</div><small>Income − spent − invested</small></div></div>
 <div class="g2"><div class="card"><h2>Budget vs actual</h2>${bars(cur)}<div class="sub" style="margin-top:8px">Marker = budget target. Red = over budget.</div></div><div><div class="card"><h2>Net worth</h2><div class="val">${R(nw)}</div><small>Cash ${R(cash())} + investments ${R(assetsVal())} − liabilities ${R(S.liab)}</small>${spark()}</div><div class="card mt"><h2>6-month cash flow</h2>${flow()}</div></div></div>
 <div class="g2"><div class="card"><h2>Goals</h2>${S.goals.slice(0,3).map(g=>`<div class="row"><div class="rt"><span>${esc(g.name)}</span><b>${g.target?Math.round(g.current/g.target*100):0}%</b></div><div class="trk"><i style="width:${Math.min(100,g.target?g.current/g.target*100:0)}%;background:var(--bl)"></i></div></div>`).join("")||'<div class="empty">No goals yet.</div>'}</div><div class="card"><h2>Recent</h2>${rec.map(txRow).join("")||'<div class="empty">Nothing this month.</div>'}</div></div>`}
const catOpts=(ty,sel)=>{let l=ty==="income"?INC:S.cats.filter(c=>c.kind!=="save").map(c=>c.name);if(sel&&!l.includes(sel))l=[sel,...l];return l.map(n=>`<option${n===sel?" selected":""}>${esc(n)}</option>`).join("")};
const assetOpts=sel=>`<option value="">— none —</option>`+S.assets.map(a=>`<option value="${a.id}"${a.id===sel?" selected":""}>${esc(a.name)}</option>`).join("");
function money(){let e=S.tx.find(x=>x.id===editId),ty=e?e.type:"expense";
 return`${mnav()}<div class="card"><h2>${e?"Edit":"Add"} transaction</h2><form id="tf"><div class="fm"><div class="fd"><label>Description</label><input id="f-d" required value="${esc(e?.desc)}"></div><div class="fd"><label>Amount (₹)</label><input id="f-a" type="number" min="0.01" step="0.01" required value="${e?e.amount:""}"></div><div class="fd"><label>Type</label><select id="f-t"><option value="expense"${ty==="expense"?" selected":""}>Expense</option><option value="income"${ty==="income"?" selected":""}>Income</option></select></div><div class="fd"><label>Category</label><select id="f-c">${catOpts(ty,e?.cat)}</select></div><div class="fd"><label>Date</label><input id="f-dt" type="date" required value="${e?e.date:iso(new Date())}"></div><div class="fd"><label>Link to investment (investing categories only)</label><select id="f-as">${assetOpts(e?.assetId)}</select></div></div>${e?"":'<label class="chk"><input type="checkbox" id="f-r"> Repeat every month</label>'}<div class="fa">${e?'<button type="button" class="btn" data-a="cancel">Cancel</button>':""}<button class="btn primary">${e?"Save changes":"Add"}</button></div></form></div>
 <div class="card mt"><h2>Transactions in ${mlabel(cur)}</h2><div class="fm"><div class="fd"><input id="q" type="search" placeholder="Search…"></div><div class="fd"><select id="qt"><option value="">All types</option><option value="income">Income</option><option value="expense">Expenses</option></select></div></div><div id="txl"></div><div class="fa"><button class="btn" data-a="csv">Export CSV</button></div></div>`}
function txList(){let q=($("q")||{value:""}).value.toLowerCase(),ty=($("qt")||{value:""}).value,l=S.tx.filter(x=>x.date.startsWith(cur)&&(!ty||x.type===ty)&&(!q||(x.desc+x.cat).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));if($("txl"))$("txl").innerHTML=l.map(txRow).join("")||'<div class="empty">No transactions found.</div>'}
function bsum(){let t=dr.reduce((a,c)=>a+(+c.pct||0),0),d=Math.round((100-t)*100)/100,ok=Math.abs(d)<.01;$("bt").textContent="Total: "+Math.round(t*100)/100+"%";$("bt").className="tot "+(ok?"pos":"neg");$("bbar").style.width=Math.min(100,t)+"%";$("bbar").style.background=ok?"var(--gr)":t>100?"var(--rd)":"var(--or)";$("bm").textContent=ok?"Perfect — every rupee has a job.":d>0?d+"% still unallocated.":(-d)+"% over 100% — reduce a category.";$("bsave").disabled=!ok||dr.some(c=>!c.name.trim());dr.forEach((c,i)=>{if($("ba"+i))$("ba"+i).textContent=R(S.income*(+c.pct||0)/100)})}
function budget(){if(!dr)dr=clone(S.cats);const o=(c,k,l)=>`<option value="${k}"${c.kind===k?" selected":""}>${l}</option>`;
 return`<div class="card"><h2>Monthly budget</h2><div class="fm"><div class="fd"><label>Monthly income target (₹)</label><input id="s-income" type="number" min="0" value="${S.income}"></div></div><div class="sub" style="margin-top:8px">Your income lands in savings, so Savings is automatic: whatever you haven’t spent or invested. Keep one “Save (auto)” category as your savings target. Percentages must total exactly 100%.</div>
 <div class="fa" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" data-a="p1">50/30/20</button><button class="btn" data-a="p2">Saver 50/25/25</button><button class="btn" data-a="bbal">Auto-balance to 100%</button></div>
 ${dr.map((c,i)=>`<div class="brow"><input data-k="name" data-i="${i}" value="${esc(c.name)}"><select data-k="kind" data-i="${i}">${o(c,"spend","Spend")}${o(c,"save","Save (auto)")}${o(c,"invest","Invest")}</select><input type="number" min="0" max="100" step="1" data-k="pct" data-i="${i}" value="${c.pct}"><span class="ba" id="ba${i}"></span><button class="btn" data-a="bdel" data-i="${i}">✕</button></div>`).join("")}
 <div class="fa" style="justify-content:flex-start"><button class="btn" data-a="badd">+ Category</button></div><div class="tot" id="bt"></div><div class="trk"><i id="bbar"></i></div><div class="sub" id="bm"></div><div class="fa"><button class="btn" data-a="brev">Discard changes</button><button class="btn primary" id="bsave" data-a="bsave">Save budget</button></div></div>
 <div class="card mt"><h2>Saved budget vs actual</h2>${mnav()}${bars(cur)}</div>`}
function alloc(l,total,w){let raw=l.map(c=>w>0?total*(+c.pct||0)/w:total/l.length),fl=raw.map(Math.floor),rem=total-fl.reduce((a,b)=>a+b,0);raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rem).forEach(x=>fl[x[1]]++);l.forEach((c,i)=>c.pct=fl[i])}
const balance=()=>{if(dr.length)alloc(dr,100,dr.reduce((a,c)=>a+(+c.pct||0),0))};
function preset(sp,sv,iv){let g={spend:sp,save:sv,invest:iv};["spend","save","invest"].forEach(k=>{let l=dr.filter(c=>c.kind===k);if(l.length)alloc(l,g[k],l.reduce((a,c)=>a+(+c.pct||0),0))});balance()}
function goals(){return`<div class="card"><h2>Add a goal</h2><form id="gf"><div class="fm"><div class="fd"><label>Name</label><input id="g-n" required></div><div class="fd"><label>Target (₹)</label><input id="g-t" type="number" min="1" required></div><div class="fd"><label>Saved so far (₹)</label><input id="g-c" type="number" min="0" value="0"></div><div class="fd"><label>Target date (optional)</label><input id="g-d" type="date"></div></div><div class="fa"><button class="btn primary">Add goal</button></div></form></div>
 <div class="g3 mt">${S.goals.map((g,i)=>{let p=g.target?Math.min(100,g.current/g.target*100):0,need="";if(g.date&&g.current<g.target){let m=Math.max(1,Math.ceil((new Date(g.date)-new Date())/2629800000));need=`<div class="sub">${R((g.target-g.current)/m)}/month to reach it by ${g.date}</div>`}
 return`<div class="card"><h2>${esc(g.name)}</h2><div class="val">${R(g.current)}</div><div class="sub">of ${R(g.target)} · ${Math.round(p)}%</div><div class="trk"><i style="width:${p}%;background:var(--bl)"></i></div>${need}<div class="fa"><button class="btn" data-a="gadd" data-i="${i}">+ Add</button><button class="btn" data-a="gedit" data-i="${i}">Edit</button><button class="btn" data-a="gdel" data-i="${i}">✕</button></div></div>`}).join("")||'<div class="card empty">No goals yet.</div>'}</div>`}
function invest(){let u=unlinked(),inv=S.assets.reduce((a,x)=>a+x.cost,0)+u,val=assetsVal();
 return`<div class="g3"><div class="card"><small>Invested</small><div class="val">${R(inv)}</div></div><div class="card"><small>Current value</small><div class="val">${R(val)}</div></div><div class="card"><small>Return</small><div class="val ${val>=inv?"pos":"neg"}">${inv?((val/inv-1)*100).toFixed(1):0}%</div></div></div>
 <div class="card mt"><h2>Add investment</h2><form id="af"><div class="fm"><div class="fd"><label>Name</label><input id="a-n" required></div><div class="fd"><label>Type</label><select id="a-t"><option>Equity</option><option>Mutual Fund</option><option>FD</option><option>Gold</option><option>Other</option></select></div><div class="fd"><label>Invested (₹)</label><input id="a-c" type="number" min="0" required></div><div class="fd"><label>Current value (₹)</label><input id="a-v" type="number" min="0" required></div><div class="fd"><label>Yearly dividend / interest (₹)</label><input id="a-i" type="number" min="0" value="0"></div></div><div class="fa"><button class="btn primary">Add</button></div></form></div>
 <div class="card mt"><h2>Portfolio</h2><div class="ov"><table><tr><th>Name</th><th>Type</th><th>Invested</th><th>Value</th><th>Return</th><th></th></tr>${S.assets.map((a,i)=>`<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${R(a.cost)}</td><td>${R(a.value)}</td><td class="${a.value>=a.cost?"pos":"neg"}">${a.cost?((a.value/a.cost-1)*100).toFixed(1):0}%</td><td><button class="btn" data-a="aval" data-i="${i}">Update</button> <button class="btn" data-a="adel" data-i="${i}">✕</button></td></tr>`).join("")}${u?`<tr><td>Unlinked investments</td><td>—</td><td>${R(u)}</td><td>${R(u)}</td><td>—</td><td></td></tr>`:""}</table>${S.assets.length||u?"":'<div class="empty">No investments yet.</div>'}</div><div class="sub">Tip: link an “Investments” transaction to an investment on the Money tab and it updates here automatically.</div></div>`}
function plan(){let p=S.plan,pc=S.cats.filter(c=>c.kind!=="spend").reduce((a,c)=>a+c.pct,0)/100,v=netWorth(),inc=S.income*12,rows=[],tc=0;for(let y=1;y<=5;y++){if(y>1)inc*=1+p.g/100;let c=inc*pc;tc+=c;v=v*(1+p.r/100)+c;rows.push([y,inc,c,v])}
 return`<div class="g3"><div class="card"><small>Today</small><div class="val">${R(netWorth())}</div></div><div class="card"><small>In 5 years</small><div class="val pos">${R(v)}</div></div><div class="card"><small>Saved + invested per month</small><div class="val">${R(S.income*pc)}</div></div></div>
 <div class="card mt"><h2>Assumptions</h2><div class="fm"><div class="fd"><label>Income growth / year (%)</label><input id="pl-g" type="number" step="0.1" value="${p.g}"></div><div class="fd"><label>Return on net worth (%)</label><input id="pl-r" type="number" step="0.1" value="${p.r}"></div></div><div class="sub" style="margin-top:8px">Uses your income target and the Save + Invest share of your budget (${Math.round(pc*100)}%). A planning model, not a promise.</div></div>
 <div class="card mt ov"><table><tr><th>Year</th><th>Income</th><th>Set aside</th><th>Net worth</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${R(r[1])}</td><td>${R(r[2])}</td><td>${R(r[3])}</td></tr>`).join("")}</table></div>`}
const fyOf=d=>{let y=+d.slice(0,4);return+d.slice(5,7)>=4?y:y-1};let fy=null;
function tax(){let ys=[...new Set(S.tx.map(x=>fyOf(x.date)).concat(fyOf(iso(new Date()))))].sort((a,b)=>b-a);if(fy===null||!ys.includes(fy))fy=ys[0];let l=S.tx.filter(x=>x.type==="income"&&fyOf(x.date)===fy),by={};l.forEach(x=>by[x.cat]=(by[x.cat]||0)+ +x.amount);
 return`<div class="card"><h2>Income records</h2><div class="fm"><div class="fd"><label>Financial year</label><select id="fy">${ys.map(y=>`<option value="${y}"${y===fy?" selected":""}>FY ${y}–${String(y+1).slice(2)}</option>`).join("")}</select></div></div><div class="val">${R(l.reduce((a,x)=>a+ +x.amount,0))}</div><small>Total recorded income, April–March</small>${Object.entries(by).map(([k,v])=>`<div class="row rt"><span>${esc(k)}</span><b>${R(v)}</b></div>`).join("")||'<div class="empty">No income recorded.</div>'}<div class="sub" style="margin-top:10px">Keep Form 16, AIS/26AS, invoices, PayPal and bank statements, dividend and interest records. This is an organising aid, not tax advice.</div></div>`}
function settings(){return`<div class="card"><h2>Balances</h2><div class="fm"><div class="fd"><label>Monthly income target (₹)</label><input id="s-income" type="number" min="0" value="${S.income}"></div><div class="fd"><label>Opening cash balance (₹)</label><input id="s-opening" type="number" value="${S.opening}"></div><div class="fd"><label>Liabilities / loans (₹)</label><input id="s-liab" type="number" min="0" value="${S.liab}"></div></div></div>
 <div class="card mt"><h2>Repeating transactions</h2>${S.rec.map((r,i)=>`<div class="tx"><span>${esc(r.desc)}<small style="display:block">${esc(r.cat)} · day ${r.day} each month</small></span><span class="b"><b>${R(r.amount)}</b><button class="btn" data-a="rdel" data-i="${i}">✕</button></span></div>`).join("")||'<div class="empty">None. Tick “Repeat every month” when adding a transaction.</div>'}</div>
 <div class="card mt"><h2>Security</h2><div class="sub">Your PIN locks the app screen. Data stays on this device and the app auto-locks after 2 minutes away. Export backups regularly.</div><div class="fa" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" data-a="chpin">Change PIN</button><button class="btn" data-a="newcode">New recovery code</button></div></div>
 <div class="card mt"><h2>Backup</h2><div class="fa" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" data-a="exp">Export backup</button><button class="btn" data-a="imp">Import backup</button><button class="btn" data-a="csv">Export CSV</button></div></div>
 <div class="card mt"><h2>Danger zone</h2><button class="btn danger" data-a="del-all">Delete all data</button></div>`}
const V={home,money,budget,goals,invest,plan,tax,set:settings};
function render(){if(!authed)return;$("mlab").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
 $("nav").innerHTML=TABS.map(t=>`<button data-a="tab" data-i="${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}</button>`).join("");$("fab").hidden=tab==="money";$("view").innerHTML=V[tab]();if(tab==="budget")bsum();if(tab==="money")txList()}
/* ---------- actions ---------- */
function download(name,text,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
function csv(){let q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';download("transactions.csv",["Date,Type,Category,Description,Amount",...S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.cat,t.desc,t.amount].map(q).join(","))].join("\n"),"text/csv")}
async function newPin(){let c=prompt("Current PIN");if(c===null)return;if(!await chk(c))return toast("Incorrect PIN");let n=prompt("New PIN (4–6 digits)");if(n===null)return;if(!/^\d{4,6}$/.test(n))return toast("PIN must be 4–6 digits");let a=getA();a.hash=await hash(n,a.salt);setA(a);toast("PIN changed")}
async function newCode(){let c=prompt("Enter your PIN to create a new recovery code");if(c===null)return;if(!await chk(c))return toast("Incorrect PIN");let a=getA(),code=rcode();a.rec=await hash(code,a.salt+"r");setA(a);alert("Your new recovery code (write it down — the old one no longer works):\n\n"+code)}
function subTx(){let amt=+$("f-a").value,d=$("f-d").value.trim(),dt=$("f-dt").value,ty=$("f-t").value,c=$("f-c").value;if(!(amt>0)||!d||!dt)return toast("Fill in description, amount and date");
 let o={desc:d,amount:amt,type:ty,cat:c,date:dt,assetId:ty==="expense"&&kindOf(c)==="invest"?$("f-as").value:""};
 if(editId){let t=S.tx.find(x=>x.id===editId);asset(t,-1);Object.assign(t,o);asset(t,1);editId=null;toast("Updated")}
 else{o.id=uid();S.tx.push(o);asset(o,1);if($("f-r")&&$("f-r").checked){let r={id:uid(),desc:d,amount:amt,type:ty,cat:c,day:Math.min(28,+dt.slice(8)),assetId:o.assetId};S.rec.push(r);S.recDone.push(r.id+"|"+dt.slice(0,7))}toast("Added")}
 cur=dt.slice(0,7);save()}
function saveBudget(){if(dr.filter(c=>c.kind==="save").length>1)return toast("Use only one Save category — savings is automatic");let names=dr.map(c=>c.name.trim().toLowerCase());if(new Set(names).size!==names.length)return toast("Category names must be unique");
 S.cats.forEach(o=>{let n=dr.find(c=>c.id===o.id);if(n&&n.name.trim()!==o.name){S.tx.forEach(t=>{if(t.cat===o.name)t.cat=n.name.trim()});S.rec.forEach(t=>{if(t.cat===o.name)t.cat=n.name.trim()})}});
 S.cats=dr.map(c=>({...c,name:c.name.trim(),pct:+c.pct||0}));dr=null;toast("Budget saved");save()}
async function act(a,i,el){switch(a){
 case"tab":tab=i;dr=null;editId=null;render();scrollTo(0,0);break;case"lock":lockNow();break;case"quick":tab="money";editId=null;dr=null;render();scrollTo(0,0);setTimeout(()=>$("f-d")&&$("f-d").focus(),60);break;
 case"pm":case"nm":{let[y,m]=cur.split("-").map(Number);cur=mk(new Date(y,m-1+(a==="nm"?1:-1),1));render();break}
 case"forgot":lockUI("recover");break;case"back":lockUI("unlock");break;
 case"erase":if(confirm("This permanently erases ALL data and the PIN on this device. Export a backup first if you have one. Continue?")){localStorage.removeItem(K);localStorage.removeItem(A);location.reload()}break;
 case"edit":editId=i;tab="money";render();scrollTo(0,0);break;case"cancel":editId=null;render();break;
 case"del":if(confirm("Delete this transaction?")){let t=S.tx.find(x=>x.id===i);asset(t,-1);S.tx=S.tx.filter(x=>x.id!==i);save();toast("Deleted")}break;
 case"csv":csv();break;
 case"badd":dr.push({id:uid(),name:"New category",pct:0,kind:"spend",color:COL[dr.length%COL.length]});render();break;
 case"bdel":dr.splice(+i,1);render();break;case"brev":dr=null;render();break;case"bsave":saveBudget();break;
 case"bbal":balance();render();break;case"p1":preset(80,10,10);render();break;case"p2":preset(50,25,25);render();break;
 case"gadd":{let n=+prompt("Amount to add (₹)","5000");if(n>0){S.goals[i].current+=n;save();toast("Goal updated")}break}
 case"gedit":{let g=S.goals[i],n=prompt("Goal name",g.name);if(n===null)return;let t=+prompt("Target (₹)",g.target);if(n.trim()&&t>0){g.name=n.trim();g.target=t;save()}break}
 case"gdel":if(confirm("Delete this goal?")){S.goals.splice(i,1);save()}break;
 case"aval":{let a2=S.assets[i],v=prompt("Current value (₹)",a2.value);if(v!==null&&+v>=0&&v!==""){a2.value=+v;save()}break}
 case"adel":if(confirm("Delete this investment?")){S.assets.splice(i,1);save()}break;
 case"rdel":S.rec.splice(i,1);save();break;
 case"chpin":await newPin();break;case"newcode":await newCode();break;
 case"exp":download("finance-backup-"+iso(new Date())+".json",JSON.stringify(S,null,2),"application/json");break;
 case"imp":$("imf").click();break;
 case"del-all":{let p=prompt("Enter your PIN to delete ALL data");if(p===null)return;if(!await chk(p))return toast("Incorrect PIN");if(confirm("Permanently delete everything on this device?")){localStorage.removeItem(K);localStorage.removeItem(A);location.reload()}}}}
document.addEventListener("click",e=>{let b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset.i,b)});
document.addEventListener("submit",e=>{let id=e.target.id;if(id==="tf"){e.preventDefault();subTx()}
 else if(id==="gf"){e.preventDefault();S.goals.push({id:uid(),name:$("g-n").value.trim(),target:+$("g-t").value,current:+$("g-c").value||0,date:$("g-d").value});toast("Goal added");save()}
 else if(id==="af"){e.preventDefault();S.assets.push({id:uid(),name:$("a-n").value.trim(),type:$("a-t").value,cost:+$("a-c").value,value:+$("a-v").value,income:+$("a-i").value||0});toast("Investment added");save()}});
document.addEventListener("input",e=>{let t=e.target;if(t.id==="q"||t.id==="qt")return txList();if(t.dataset.k&&dr){let c=dr[+t.dataset.i];if(t.dataset.k==="pct")c.pct=Math.max(0,Math.min(100,+t.value||0));else c[t.dataset.k]=t.value;bsum()}});
document.addEventListener("change",e=>{let t=e.target,m={"s-income":"income","s-opening":"opening","s-liab":"liab"};
 if(t.id==="qt")return;if(t.id==="f-t")$("f-c").innerHTML=catOpts(t.value);
 else if(m[t.id]){S[m[t.id]]=Math.max(t.id==="s-opening"?-1e12:0,+t.value||0);save();toast("Saved")}
 else if(t.id==="pl-g"||t.id==="pl-r"){S.plan[t.id==="pl-g"?"g":"r"]=+t.value||0;save()}
 else if(t.id==="fy"){fy=+t.value;render()}
 else if(t.id==="imf"){let f=t.files[0];if(!f)return;f.text().then(x=>{let d=JSON.parse(x);if(d&&Array.isArray(d.transactions)&&!d.tx)d=migrate(d);if(!d||!Array.isArray(d.tx)||!Array.isArray(d.cats))throw 0;if(!confirm("Replace ALL current data with this backup?"))return;S=Object.assign(DEF(),d);save();toast("Backup restored")}).catch(()=>toast("That file isn't a valid backup")).finally(()=>t.value="")}});
/* ---------- start ---------- */
(async function(){S=load();if(!localStorage.getItem(K))store();let a=getA(),old=localStorage.getItem("financeOS_pin");
 if(!a&&/^\d{4}$/.test(old||"")){try{let salt=rcode();setA({salt,hash:await hash(old,salt),rec:null,fails:0,until:0});localStorage.removeItem("financeOS_pin");a=getA()}catch(e){}}
 lockUI(a?"unlock":"setup",a&&!a.rec?"Tip: after unlocking, create a recovery code in Settings.":"");
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script></body></html>
